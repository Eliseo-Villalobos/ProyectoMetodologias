<h2>Destinos disponibles</h2>

@if (error) {
  <p>{{ error }}</p>
}

@if (cargando) {
  <p>Cargando destinos...</p>
}

<div class="viajes-grid">
  @for (viaje of viajes; track viaje.id_viaje) {
    <app-viaje-card
      [viaje]="viaje"
      (seleccionar)="verDetalle($event)">
    </app-viaje-card>
  }
</div>

@if (viajes.length === 0 && !error) {
  <p>No hay viajes disponibles por el momento.</p>
}
