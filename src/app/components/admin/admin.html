<div class="admin-container">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <h2>Panel Admin</h2>
      <p>{{ admin?.usuario }}</p>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item active">
        <span>📊</span> Dashboard
      </a>
      <a class="nav-item">
        <span>🏗️</span> Proyectos
      </a>
      <a class="nav-item">
        <span>🛠️</span> Servicios
      </a>
      <a class="nav-item">
        <span>🏢</span> Empresa
      </a>
    </nav>

    <button class="logout-btn" (click)="cerrarSesion()">
      Cerrar Sesión
    </button>
  </aside>

  <!-- Contenido principal -->
  <main class="admin-main">
    <div class="admin-header">
      <h1>Bienvenido, {{ admin?.usuario }} 👋</h1>
      <p>Panel de administración</p>
    </div>

    <!-- Tarjetas de resumen -->
    <div class="cards-grid">
      <div class="card">
        <div class="card-icon">🏗️</div>
        <div class="card-info">
          <h3>Proyectos</h3>
          <p class="card-number">0</p>
        </div>
      </div>
      <div class="card">
        <div class="card-icon">🛠️</div>
        <div class="card-info">
          <h3>Servicios</h3>
          <p class="card-number">0</p>
        </div>
      </div>
      <div class="card">
        <div class="card-icon">👁️</div>
        <div class="card-info">
          <h3>Visitas totales</h3>
          <p class="card-number">0</p>
        </div>
      </div>
    </div>
  </main>

</div>
